name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: myapp
  LOG_LEVEL: info

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest

      - name: Usar token (oculto en logs)
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: echo "App $APP_NAME, Python ${{ matrix.python-version }}, token $API_TOKEN"

  build:
    needs: test
    uses: ./.github/workflows/workflow_reus.yml
    with:
      image-name: myapp
